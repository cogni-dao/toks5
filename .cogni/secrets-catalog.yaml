# Per-node secrets catalog — node-domain (single-node-scope).
#
# Declare the SHAPE of each A2 secret this node's app consumes; NEVER the value.
# `service:` auto-resolves to this node's slug, so each key lands at
# OpenBao `cogni/<env>/<slug>/<KEY>` and fans out ONLY to this node's pod.
#
# The VALUE is written separately — see https://cognidao.org/knowledge/node-self-serve-secrets §3:
#   - self-serve: POST /api/v1/nodes/<id>/secrets  (node-owner, OpenFGA-gated, API key only)
#   - ops:        pnpm secrets:set <env> <slug> <KEY>
#
# This file ships empty. Add entries as your node needs them, e.g.:
#
# secrets:
#   - name: MY_VENDOR_API_KEY
#     tier: A2
#     appliesTo: web
#     shared: false
#     source: human
#     required: true
#     category: "Vendor Name"
#     description: One line describing what consumes this key.
#     steps:
#       - "Create the key in the vendor dashboard."

# Service assertions (story.0038). Every entry is optional (`required: false`): unset means no jwks route and no outbound signer. Public URLs (the homes this node
# trusts, the nodes its AI calls) are Git config in `.cogni/service-links.yaml`, never secrets.
secrets:
  # SERVICE_ASSERTION_SIGNING_SEED (the home's signing seed) returns once this node's secrets_manager role is approved; until then toks5 verifies assertions but does not sign.
  - name: GITHUB_READ_TOKEN
    tier: A2
    source: human
    workloads: [app]
    required: false
    category: Service assertions
    description: Optional read-only GitHub token sent as a bearer on the org owner repo-spec read (lifts the unauthenticated rate limit); unset reads unauthenticated.
    steps:
      - "Required read: https://cognidao.org/knowledge/node-self-serve-secrets. Use a fine-grained token with read access to public repository contents only."
